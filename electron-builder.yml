appId: vn.binhvuong.minizalo
productName: MiniZalo
copyright: Copyright © 2026 MiniZalo contributors

directories:
  output: release
  buildResources: build

# Only ship the compiled app; production node_modules are collected automatically
# by electron-builder from the (hoisted) workspace root.
files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/{.eslintrc,.editorconfig,tsconfig*.json}"

# better-sqlite3 is a native module — its .node binding cannot live inside the
# asar archive or it fails to load at runtime.
asarUnpack:
  - "**/*.node"
  - "**/node_modules/better-sqlite3/**"

# Rebuild native deps against the bundled Electron's ABI.
npmRebuild: true

win:
  target:
    - nsis
  # icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.social-networking
  # icon: build/icon.icns
  # Unsigned MVP build. Users open via right-click → Open (see deployment-guide).

linux:
  # deb requires a maintainer; use a GitHub noreply address (no personal email).
  maintainer: MiniZalo contributors <vuongnguyenbinh@users.noreply.github.com>
  target:
    - AppImage
    - deb
  category: Network
  # icon: build/icon.png

# Publish to GitHub Releases. Local `npm run dist` does not publish; only CI's
# `electron-builder --publish always` uploads. releaseType:release makes the
# Release public immediately (electron-builder otherwise defaults to a draft).
publish:
  provider: github
  releaseType: release
